[project]
name = "council-analyzer"
version = "0.1.0"
description = "Agentic RAG platform for analyzing city/county council meeting transcripts"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26,<2",  # torch/sentence-transformers builds available for older Python aren't NumPy-2-compatible yet
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
