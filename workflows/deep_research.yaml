name: deep_research

# The sequence. Bounded agentic decisions happen *inside* steps:
# the researcher chooses its own searches; critique may trigger one
# extra research pass; data_analysis is skipped unless the planner
# flagged the question as quantitative.
steps:
  - plan
  - research
  - data_analysis
  - draft
  - critique
  - revise

# Per-agent model routing. Cheap model for structured decomposition,
# stronger models where judgement actually matters.
models:
  default: claude-sonnet-5
  planner: claude-haiku-4-5
  researcher: claude-sonnet-5
  data_analyst: claude-sonnet-5
  critic: claude-sonnet-5
  reporter: claude-sonnet-5

# Least privilege: an agent can only request tools listed here.
# The planner and critic get none - they reason over state, not the world.
tools:
  researcher:
    - search_transcripts
  data_analyst:
    - get_schema
    - run_readonly_sql
    - calculate

approvals:
  search_transcripts: never
  get_schema: never
  run_readonly_sql: never
  calculate: never

limits:
  max_tool_calls: 25
  max_model_calls: 30
  max_cost_usd: 1.00
